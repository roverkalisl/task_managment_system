<!-- templates/register.html -->
{% extends 'base.html' %}
{% block content %}

<div class="max-w-md mx-auto bg-white p-6 rounded shadow">
    <h2 class="text-xl font-bold mb-4">Register</h2>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" class="w-full p-2 border mb-2">
        <input type="text" name="phone" placeholder="Phone Number" class="w-full p-2 border mb-2">
        <input type="text" name="member_id" placeholder="Member ID" class="w-full p-2 border mb-2">
        <input type="password" name="password" placeholder="Password" class="w-full p-2 border mb-2">

        <button class="bg-green-600 text-white px-4 py-2 rounded w-full">
            Register
        </button>
    </form>

</div>

{% endblock %}
