{% extends 'base.html' %}
{% block content %}

<div class="max-w-2xl mx-auto bg-white p-6 rounded shadow">
    <h2 class="text-xl font-bold mb-4">Create New Task</h2>

    {% if error %}
    <div class="bg-red-100 text-red-700 p-3 rounded mb-4">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label class="block mb-2">Title</label>
        <input type="text" name="title" class="w-full p-2 border rounded mb-3" placeholder="Task title">

        <label class="block mb-2">Description</label>
        <textarea name="description" class="w-full p-2 border rounded mb-3" rows="4" placeholder="Task description"></textarea>

        <label class="block mb-2">Task Type</label>
        <select name="task_type" class="w-full p-2 border rounded mb-3">
            <option value="share">Share</option>
            <option value="post">Post</option>
        </select>

        <label class="block mb-2">Target Link</label>
        <input type="text" name="target_link" class="w-full p-2 border rounded mb-3" placeholder="https://facebook.com/...">

        <label class="block mb-2">Reward</label>
        <input type="number" name="reward" step="0.01" class="w-full p-2 border rounded mb-3" placeholder="Reward amount">

        <label class="block mb-2">Total Slots</label>
        <input type="number" name="total_slots" class="w-full p-2 border rounded mb-3" value="100">

        <button class="bg-blue-600 text-white px-4 py-2 rounded">Create Task</button>
    </form>
</div>

{% endblock %}
