{% extends 'base.html' %}
{% block content %}

<div class="max-w-2xl mx-auto bg-white p-6 rounded shadow">
    <h2 class="text-xl font-bold mb-4">Create New User</h2>

    {% if error %}
    <div class="bg-red-100 text-red-700 p-3 rounded mb-4">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label class="block mb-2">Username</label>
        <input type="text" name="username" class="w-full p-2 border rounded mb-3" placeholder="Username">

        <label class="block mb-2">Email</label>
        <input type="email" name="email" class="w-full p-2 border rounded mb-3" placeholder="Email address">

        <label class="block mb-2">Phone</label>
        <input type="text" name="phone" class="w-full p-2 border rounded mb-3" placeholder="Phone number">

        <label class="block mb-2">Member ID</label>
        <input type="text" name="member_id" class="w-full p-2 border rounded mb-3" placeholder="Member ID">

        <label class="block mb-2">Password</label>
        <input type="password" name="password" class="w-full p-2 border rounded mb-3" placeholder="Password">

        <label class="inline-flex items-center mb-3">
            <input type="checkbox" name="is_staff" class="mr-2"> Staff / Admin user
        </label>

        <button class="bg-blue-600 text-white px-4 py-2 rounded">Create User</button>
    </form>
</div>

{% endblock %}
