<!-- templates/wallet.html -->
{% extends 'base.html' %}
{% block content %}

<h2 class="text-2xl font-bold mb-4">Wallet</h2>

<div class="bg-white p-6 rounded shadow mb-4">
    <h3>Balance</h3>
    <p class="text-3xl text-green-600">Rs. {{ balance }}</p>
</div>

<h3 class="font-bold mb-2">Transactions</h3>

<table class="w-full bg-white rounded shadow">
    <tr class="bg-gray-200">
        <th class="p-2">Amount</th>
        <th class="p-2">Status</th>
        <th class="p-2">Date</th>
    </tr>

    {% for t in transactions %}
    <tr>
        <td class="p-2">{{ t.amount }}</td>
        <td class="p-2">{{ t.status }}</td>
        <td class="p-2">{{ t.created_at }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
