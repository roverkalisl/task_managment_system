<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FB Task Platform{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<!-- Navbar -->
<nav class="bg-blue-600 p-4 text-white flex justify-between items-center">
    <h1 class="font-bold">🔥 Task Platform</h1>
    <div class="space-x-3">
        {% if request.user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="px-3">Dashboard</a>
            <a href="{% url 'tasks' %}" class="px-3">Tasks</a>
            <a href="{% url 'wallet' %}" class="px-3">Wallet</a>
            {% if request.user.is_staff %}
                <a href="{% url 'review_submissions' %}" class="px-3">Review</a>
                <a href="{% url 'create_task' %}" class="px-3">Create Task</a>
                <a href="{% url 'create_user' %}" class="px-3">Create User</a>
            {% endif %}
            <a href="{% url 'logout' %}" class="px-3 bg-red-500 px-3 py-1 rounded">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="px-3">Login</a>
            <a href="{% url 'selflogin' %}" class="px-3">Quick Login</a>
            <a href="{% url 'register' %}" class="px-3 bg-green-500 px-3 py-1 rounded">Register</a>
        {% endif %}
    </div>
</nav>

<div class="p-6">
    {% block content %}{% endblock %}
</div>

</body>
</html>
